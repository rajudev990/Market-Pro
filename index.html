<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">


</head>

<body>

    <div class="container mt-5 mb-5">
        <div class="row">
            <div class="col-lg-12">
                <div class="accordion" id="contactAccordion">

                    <div class="accordion-item bg-transparent border-0">

                        <!-- HEADER -->
                        <h2 class="accordion-header separate-header" id="headingOne">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                <i class="bi bi-person-fill me-2"></i> Contact Information
                            </button>
                        </h2>

                        <!-- SPACE -->
                        <div class="accordion-gap"></div>

                        <!-- BODY -->
                        <div id="collapseOne" class="accordion-collapse collapse show"
                            data-bs-parent="#contactAccordion">
                            <div class="accordion-body custom-box">
                                <form>
                                    <!-- Radio Group (No label) -->
                                    <div class="col-md-12 form-group">
                                        <div class="radio-group mb-4">
                                            <div>
                                                <input type="radio" id="business" name="address_type" value="business">
                                                <label class="address_type" for="business">Business Address</label>
                                            </div>

                                            <div>
                                                <input type="radio" id="home" name="address_type" value="home">
                                                <label class="address_type" for="home">Home Address</label>
                                            </div>

                                            <div>
                                                <input type="radio" id="both" name="address_type"
                                                    value="business_or_home">
                                                <label class="address_type" for="both">Business Address or Home
                                                    Address</label>
                                            </div>

                                            <div>
                                                <input type="radio" id="both" name="address_type"
                                                    value="business_and_home">
                                                <label class="address_type" for="both">Business Address and Home
                                                    Address</label>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Row 1 -->
                                    <div class="row">
                                        <!-- One Col -->
                                        <div class="col-lg-3 col-md-3 col-12">

                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control custom-input" id="street"
                                                    placeholder="Street Address">
                                                <label class="label-lg label-md" for="street">Street Address</label>
                                            </div>
                                            <div class="mb-3" style="position: relative;">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control custom-input" id="city"
                                                        placeholder="City">
                                                    <label class="label-lg label-md" for="city">City</label>
                                                </div>
                                                <img src="assets/icons/group.png" alt=""
                                                    style="position: absolute;right: -20px;top: 8px;">

                                            </div>


                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control custom-input" id="state"
                                                    placeholder="State">
                                                <label class="label-lg label-md" for="state">State</label>
                                            </div>

                                            <div class="mb-3" style="position: relative;">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control custom-input" id="zip"
                                                        placeholder="Zip Code">
                                                    <label class="label-lg label-md" for="zip">Zip Code</label>
                                                </div>
                                                <img src="assets/icons/group.png" alt=""
                                                    style="position: absolute;right: -20px;top: 8px;">

                                            </div>



                                            <div class="mb-3" style="position: relative;">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control custom-input" id="state"
                                                        placeholder="Sectional (3-Digit) Zip
                                                    Code">
                                                    <label class="label-lg label-md" for="state">Sectional (3-Digit) Zip
                                                        Code</label>
                                                </div>
                                                <img src="assets/icons/group.png" alt=""
                                                    style="position: absolute;right: -20px;top: 8px;">

                                            </div>

                                            <div class="form-group mb-3">
                                                <select class="form-control custom-input form-select" id="gender">
                                                    <option selected>Gender</option>
                                                    <option>Male</option>
                                                    <option>Female</option>
                                                    <option>Other</option>
                                                </select>
                                            </div>




                                        </div>
                                        <!-- One Col-->
                                        <!-- Two Col -->
                                        <div class="col-lg-3 col-md-3 col-12">



                                            <div class="mb-3" style="position: relative;">
                                                <div class="form-floating">
                                                    <input type="text" class="form-control custom-input" id="country"
                                                    placeholder="Country">
                                                     <label class="label-lg label-md" for="street">Country</label>
                                                </div>
                                                <img src="assets/icons/group.png" alt=""
                                                    style="position: absolute;right: -20px;top: 8px;">

                                            </div>

                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control custom-input" id="metro_area"
                                                    placeholder="Metro Area">
                                                <label class="label-lg label-md" for="metro_area">Metro Area</label>
                                            </div>

                                            <div class="form-group mb-3">
                                                <select class="form-control custom-input form-select" id="country">
                                                    <option selected>Country</option>
                                                    <option>Bangladesh</option>
                                                    <option>India</option>
                                                    <option>Australia</option>
                                                </select>
                                            </div>

                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control custom-input" id="area_code"
                                                    placeholder="Area Code">
                                                <label class="label-lg label-md" for="area_code">Area Code</label>
                                            </div>

                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control custom-input" id="phone_number"
                                                    placeholder="Phone Number">
                                                <label class="label-lg label-md" for="phone_number">Phone Number</label>
                                            </div>



                                            <div class="form-group mb-3">
                                                <select class="form-control custom-input form-select" id="hq_office">
                                                    <option selected>Works at HQ Office</option>
                                                    <option>Option 1</option>
                                                    <option>Option 2</option>
                                                    <option>Option 3</option>
                                                </select>
                                            </div>
                                            <div class="form-group mb-3">
                                                <select class="form-control custom-input form-select" id="work_office">
                                                    <option selected>Works at OSJC Office</option>
                                                    <option>Option 1</option>
                                                    <option>Option 2</option>
                                                    <option>Option 3</option>
                                                </select>
                                            </div>
                                            <div class="form-group mb-3">
                                                <select class="form-control custom-input form-select" id="language">
                                                    <option selected>Language</option>
                                                    <option>English</option>
                                                    <option>Bangla</option>
                                                    <option>Arabic</option>
                                                </select>
                                            </div>
                                            <div class="form-group mb-3">
                                                <select class="form-control custom-input form-select" id="education">
                                                    <option selected>Education</option>
                                                    <option>SSC</option>
                                                    <option>HSC</option>
                                                    <option>Level 1</option>
                                                </select>
                                            </div>


                                        </div>
                                        <!-- Two Col-->
                                        <!-- Three Col -->
                                        <div class="col-lg-3 col-md-3 col-12">
                                            <label style="font-size: 16px;font-weight: 500;">Show Reps with:</label>
                                            <div class="mb-4 reps_box">
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="business_phone" name="business_phone"
                                                        value="business_phone">
                                                    <label class="reps ms-2" for="business_phone">Business Phone</label>
                                                </div>

                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="business_phone_dnc"
                                                        name="business_phone_dnc" value="business_phone_dnc">
                                                    <label class="reps ms-2" for="business_phone_dnc">Business Phone
                                                        Excluding DNC</label>
                                                </div>

                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="home_phone" name="home_phone"
                                                        value="home_phone">
                                                    <label class="reps ms-2" for="home_phone">Home Phone</label>
                                                </div>

                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="home_phone_dnc" name="home_phone_dnc"
                                                        value="home_phone_dnc">
                                                    <label class="reps ms-2" for="home_phone_dnc">Home Phone Excluding
                                                        DNC</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="home_address" name="home_address"
                                                        value="home_address">
                                                    <label class="reps ms-2" for="home_address">Home Address</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="professional_website"
                                                        name="professional_website" value="professional_website">
                                                    <label class="reps ms-2" for="professional_website">Professional
                                                        Website</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="linkedin" name="linkedin"
                                                        value="linkedin">
                                                    <label class="reps ms-2" for="linkedin">LinkedIn</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="military_service" name="military_service"
                                                        value="military_service">
                                                    <label class="reps ms-2" for="military_service">Military
                                                        Service</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="notes" name="notes" value="notes">
                                                    <label class="reps ms-2" for="notes">Notes Entered</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="usps_certificated"
                                                        name="usps_certificated" value="usps_certificated">
                                                    <label class="reps ms-2" for="usps_certificated">USPS
                                                        Certified</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="business_address" name="business_address"
                                                        value="business_address">
                                                    <label class="reps ms-2" for="business_address">Business
                                                        Address</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="home_address" name="home_address"
                                                        value="home_address">
                                                    <label class="reps ms-2" for="home_address">Home Address</label>
                                                </div>
                                            </div>

                                        </div>
                                        <!-- Three Col-->
                                        <!-- Four Col -->
                                        <div class="col-lg-3 col-md-3 col-12">

                                            <div class="card-body filters"
                                                style="border: 1px solid #808080;background: #EBEBEB;">
                                                <h5 style="font-weight: 500;">Email Filters <b><i
                                                            class="bi bi-info-circle" style="color: #6955FF;"></i></b>
                                                </h5>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="reps_email" name="reps_email"
                                                        value="reps_email">
                                                    <label class="reps ms-2" for="reps_email">Reps with Email
                                                        Available</label>
                                                </div>
                                                <div class="align-items-center d-flex">
                                                    <input type="checkbox" id="validated_mail" name="validated_mail"
                                                        value="validated_mail">
                                                    <label class="reps ms-2" for="validated_mail">Validated for Mass
                                                        Mail</label>
                                                </div>
                                                <div class="form-group mb-2">
                                                    <select style="background: #ebebeb;width: 92%;"
                                                        class="form-control custom-input form-select" id="email_type">
                                                        <option selected>Email Type</option>
                                                        <option>Option 1</option>
                                                        <option>Option 1</option>
                                                        <option>Option 1</option>
                                                    </select>
                                                </div>
                                                
                                                <div class="mb-2" style="position: relative;">
                                                    <div class="form-floating">
                                                        <input style="background: #ebebeb;width: 92%;" type="text"
                                                            class="form-control custom-input" id="email_domain"
                                                            placeholder="Email Domain">
                                                        <label class="label-lg label-md" for="street">Email Domain</label>
                                                    </div>
                                                    <img src="assets/icons/group.png" alt=""
                                                        style="position: absolute;right: -4px;top: 8px;">

                                                </div>

                                                <div class="mb-2" style="position: relative;">
                                                    <div class="form-floating">
                                                        <input style="background: #ebebeb;width: 92%;" type="text"
                                                        class="form-control custom-input" id="email_address"
                                                        placeholder="Email Address">
                                                    <label class="label-lg label-md" for="email_address">Email
                                                        Address</label>
                                                    </div>
                                                    <img src="assets/icons/group.png" alt=""
                                                        style="position: absolute;right: -4px;top: 8px;">

                                                </div>

                                            </div>

                                             <div class="mb-2 mt-2 ms-3" style="position: relative;">
                                                <div class="form-floating">
                                                    <input type="text" style="width: 88%;"
                                                    class="form-control custom-input" id="branch"
                                                    placeholder="DD Physical Branch">
                                                <label class="label-lg label-md" for="branch">DD Physical Branch</label>
                                                </div>
                                                <img src="assets/icons/group.png" alt=""
                                                    style="position: absolute;right: 5px;top: 8px;">

                                            </div>

                                        </div>
                                        <!-- Four Col-->

                                    </div>
                                    <!-- Row 1 -->
                                </form>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>

</body>

</html>
